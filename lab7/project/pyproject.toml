[project]
name = "lab7-project"
version = "0.1.0"
description = "Lab 7: MPI collective matrix multiply (mpi4py + numpy)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "mpi4py>=4.0",
  "matplotlib>=3.8",
]

[project.scripts]
lab7-demo = "benchmarks.demo:main"
lab7-bench-plot = "benchmarks.run_benchmarks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_multiplication", "benchmarks", "plots"]

[tool.uv]
package = true
